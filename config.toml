# RSS Feed URL
feed_url = "https://guyanachronicle.com/feed/"

# Output directory for WAV files
output_dir = "./output"

# macOS voice name (e.g., "Daniel" for UK English, "Samantha" for US English)
voice = "Shelly"

# Speech speed in words per minute
speed = 175

# Interval in seconds between fetch cycles (default: 3600 = 1 hour)
interval_secs = 3600

# How many days to keep WAV files (older files are deleted after each run)
retention_days = 5
